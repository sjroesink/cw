<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23295fd4'/%3E%3Cpath d='M11 9 L5 16 L11 23 M21 9 L27 16 L21 23' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
:root {
  color-scheme: light;
  --bg: oklch(0.98 0.006 150);
  --surface: oklch(1 0 0);
  --line: oklch(0.9 0.008 155);
  --ink: oklch(0.2 0.01 160);
  --muted: oklch(0.47 0.012 160);
  --accent: oklch(0.52 0.14 255);
  --on-accent: oklch(1 0 0);
  --warn: oklch(0.5 0.15 25);
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --sans: Sora, system-ui, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: oklch(0.19 0.006 160);
    --surface: oklch(0.23 0.007 160);
    --line: oklch(0.32 0.008 160);
    --ink: oklch(0.94 0.005 160);
    --muted: oklch(0.68 0.01 160);
    --accent: oklch(0.7 0.12 255);
    --on-accent: oklch(0.16 0.01 160);
    --warn: oklch(0.72 0.13 25);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%; max-width: 420px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 28px;
}
h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
p { margin: 0 0 18px; color: var(--muted); }
.slug { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 22px; }
form { display: __FORM__; }
label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
input {
  width: 100%; padding: 10px 12px; font: inherit; color: inherit;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
  margin-top: 14px; width: 100%; padding: 10px 12px; font: inherit; font-weight: 500;
  color: var(--on-accent); background: var(--accent);
  border: 0; border-radius: 8px; cursor: pointer;
}
button:hover { filter: brightness(0.94); }
.bad { color: var(--warn); font-size: 13px; margin-top: 12px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="card">
  <h1>__TITLE__</h1>
  <p>__BLURB__</p>
  <div class="slug">__SLUG__</div>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Open</button>
    <div class="bad" id="bad" role="alert"></div>
  </form>
</div>
<script>
const form = document.getElementById("f");
if (form) form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const bad = document.getElementById("bad");
  bad.textContent = "";
  try {
    const res = await fetch("/api/v1/walkthroughs/__SLUG__/unlock", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.ok && body.ok) { location.reload(); return; }
    bad.textContent = body.message || "That did not work.";
  } catch (err) {
    bad.textContent = String(err.message || err);
  }
});
</script>
</body>
</html>
